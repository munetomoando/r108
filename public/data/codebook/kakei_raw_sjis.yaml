title: 都道府県庁所在市・政令指定都市別 生鮮食品の支出金額（2025年、二人以上の世帯）
file: kakei_raw_sjis.csv
source: 総務省統計局「家計調査 家計収支編」二人以上の世帯 詳細結果表 年次 2025年 第4-1表「都市階級・地方・都道府県庁所在市別１世帯当たり支出金額，購入数量及び平均価格」（e-Stat、statInfId=000040409546、2026-10-23取得）。シート「二人・市別」から生鮮4品目の支出金額だけを抜き出し、都市を行に並べた（値は元表のまま。data-raw/fetch_kakei_raw_sjis.R）
encoding: CP932（Shift-JIS）。UTF-8 として読むと文字化けする
layout: 先頭5行が表の情報（統計名・統計表番号・表題・2025年計・二人以上の世帯）、6〜8行目が見出し（品目分類・分類コード・支出金額の単位）、9〜60行目が52都市、61〜65行目が注記（※1〜※4と加工の注記）。read_csv(locale = locale(encoding = "CP932"), skip = 8, n_max = 52, col_names = FALSE) で都市の行だけを読める
rows: 52
unit_of_observation: 都道府県庁所在市（東京都は区部）と、それ以外の政令指定都市（川崎市・相模原市・浜松市・堺市・北九州市）
columns:
  - name: 品目分類
    description: 地域コード（5桁）と都市名（例「01100 札幌市」「13100 東京都区部」）。6行目の見出しは元表どおり「品目分類」
    unit: なし
  - name: 生鮮魚介
    description: 1世帯当たり年間の生鮮魚介への支出金額（分類コード 1.2.1）
    unit: 円
  - name: 生鮮肉
    description: 1世帯当たり年間の生鮮肉への支出金額（分類コード 1.3.1）
    unit: 円
  - name: 生鮮野菜
    description: 1世帯当たり年間の生鮮野菜への支出金額（分類コード 1.5.1）
    unit: 円
  - name: 生鮮果物
    description: 1世帯当たり年間の生鮮果物への支出金額（分類コード 1.6.1）
    unit: 円
