title: 消費者物価指数 総合と生鮮食品を除く総合（全国・月次、2025年基準、2000年1月〜2026年9月）
file: cpi_monthly.csv
source: 総務省統計局「消費者物価指数（2025年基準）」（e-Stat 統計表ID 0004052037、2026-10-23 更新・取得。全国、指数、品目 0001 総合・0161 生鮮食品を除く総合）。照合に同「消費者物価指数（2020年基準）」0003427113 を使用。data-raw/download_cpi_monthly.R で取得、data-raw/fetch_cpi_monthly.R で作成（手入力なし）
rows: 321
unit_of_observation: 月（全国）
notes: >-
  2025年の年平均を100とする指数（2025年基準）。2024年12月以前は、統計局が旧基準の指数を2025年基準に換算して接続した値。
  cpi_core は「生鮮食品を除く総合」（いわゆるコアCPI。日本銀行の物価目標の議論でよく使われる）。
  2014年4月（消費税率5→8%）と2019年10月（8→10%。食料品などは軽減税率8%、同時期に幼児教育無償化）の引上げを含む。
  この表の指数から計算した前年同月比は、統計局の公表値と0.1ポイント違うことがある（公表値は旧基準の丸める前の指数から計算した値のまま。
  例: 2019年10月の生鮮食品を除く総合は、この表から計算すると0.3%、公表値は0.4%）。
columns:
  - name: date
    description: 年月（その月の1日の日付、YYYY-MM-01）
    unit: 日付
  - name: cpi_all
    description: 消費者物価指数 総合（全国）
    unit: 指数（2025年=100）
  - name: cpi_core
    description: 消費者物価指数 生鮮食品を除く総合（全国）
    unit: 指数（2025年=100）
