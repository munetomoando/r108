title: 四半期別 実質GDP（季節調整系列、1994年1–3月期〜2026年4–6月期）
file: gdp_quarterly.csv
source: 内閣府経済社会総合研究所「国民経済計算（GDP統計）」四半期別GDP速報 2026年4-6月期・2次速報値（2026年9月8日公表、2020年基準・2020暦年連鎖価格）。統計表「実質季節調整系列」gaku-jk2622.csv と「実質季節調整系列(前期比)」ritu-jk2622.csv（https://www.esri.cao.go.jp/jp/sna/data/data_list/sokuhou/files/2026/qe262_2/gdemenuja.html、2026-10-23取得）。data-raw/fetch_gdp_quarterly.R で保存済みの元資料から作成（手入力なし）。元ファイルと出所は data-raw/raw/gdp_quarterly/
rows: 130
unit_of_observation: 四半期（1994年1–3月期〜2026年4–6月期、欠けた期なし）
notes: >-
  国内総生産（支出側）の実質・季節調整系列。内閣府の表どおり水準は「年率表示」（その四半期のペースが1年続いた場合の額、
  つまり四半期の額のおよそ4倍）で、年間のGDP（暦年値）と同じ桁（約500〜600兆円）になる。前期比は年率換算していない。
  growth_qoq は内閣府の公表値をそのまま使っており、real_gdp から計算した前期比とは丸めの範囲（±0.05ポイント）で一致する。
  公表値が「-0.0」の期（1997年10–12月期など）は 0 に近い小さな減少を表す。
  季節調整は速報のたびに1994年まで遡って改定されるので、他の回の速報の値とは過去の期も一致しない
columns:
  - name: quarter
    description: 四半期の初日（1–3月期=YYYY-01-01、4–6月期=YYYY-04-01、7–9月期=YYYY-07-01、10–12月期=YYYY-10-01）
    unit: 日付
  - name: real_gdp
    description: 実質国内総生産（支出側）、季節調整済み、2020暦年連鎖価格、年率表示。元の10億円単位の値を1000で割ったもの（丸めなし、小数4桁＝1億円単位）
    unit: 兆円
  - name: growth_qoq
    description: 実質GDPの前期比（季節調整済み、年率換算しない）。内閣府の公表値（小数1桁）をそのまま使用。最初の期（1994年1–3月期）は NA
    unit: "%"
