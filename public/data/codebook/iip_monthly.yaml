title: 鉱工業生産指数 鉱工業総合（全国・月次、2020年基準、2018年1月〜2026年8月）
file: iip_monthly.csv
source: 経済産業省「鉱工業生産・出荷・在庫指数」2020年基準 季節調整済指数・原指数【月次】付加価値額生産（同省サイトの Excel b2020_gsm1j.xlsx・b2020_gom1j.xlsx、シート「生産」、品目 鉱工業。2026-10-24 取得）。2026年3月までは e-Stat 統計表 0004052177・0004052181 と全月一致を確認。data-raw/fetch_iip_monthly.R で作成（手入力なし）
rows: 104
unit_of_observation: 月（全国）
notes: >-
  2020年の平均を100とする指数（2020年基準、付加価値額ウエイト）。原指数の2020年平均は99.98（月次の値の丸めによる）。
  2020年基準の表は2018年1月から始まるので、それより前の月は無い（2015年基準の系列とはつないでいない）。
  季節調整済指数は毎年の年間補正で過去にさかのぼって改定される。本データは2026年10月24日に取得した時点の値で、
  当時の速報・確報の値とは違う月がある。
  原指数は季節調整していない値で、年度末の3月に高く、お盆の8月が最も低く、年始の1月と大型連休の5月も低い。
  2020年4〜6月は新型コロナウイルス感染症の影響で大きく落ち込み、5月が最も低い。
columns:
  - name: date
    description: 年月（その月の1日の日付、YYYY-MM-01）
    unit: 日付
  - name: iip_sa
    description: 鉱工業生産指数 鉱工業総合（季節調整済指数）
    unit: 指数（2020年=100）
  - name: iip_nsa
    description: 鉱工業生産指数 鉱工業総合（原指数）
    unit: 指数（2020年=100）
