title: 都道府県別 所定内給与額と所定内実労働時間数（一般労働者、2019〜2025年）
file: wage_census_pref.csv
source: 厚生労働省「賃金構造基本統計調査」（e-Stat 掲載の Excel ファイル、2026-10-23取得）。2020〜2025年は各年の都道府県別 参考表1（47都道府県一覧）、2019年は「【参考掲載】令和２年調査と同じ推計方法を用いた過去分の集計」の都道府県別第1表。data-raw/fetch_wage_census_pref.R で保存済みの元ファイル（data-raw/raw/wage_census_pref/、出所の詳細は SOURCES.md）から作成（手入力なし）
rows: 987
unit_of_observation: 都道府県×年×性別（47県×2019〜2025年×男女計・男・女）
notes: >-
  対象は一般労働者（短時間労働者を除く）、企業規模計（10人以上）、産業計、学歴計、年齢計で、各年6月分の値。
  2020年調査から推計方法（復元倍率の算出方法）が変わったため、2019年は旧推計方法の公表値ではなく、
  厚生労働省が令和２年と同じ推計方法で集計し直した参考系列の値を載せている（2019〜2025年は同じ推計方法でそろう）。
  旧推計方法の2019年の公表値（全国の男女計 307.7千円）とは県によって最大 9.8千円違う（新推計の全国は 306.0千円）。
  全国の値（公表値、男女計の所定内給与額）は 2019年 306.0、2020年 307.7、2021年 307.4、2022年 311.8、2023年 318.3、
  2024年 330.4、2025年 340.6千円で、本ファイルには含めない（47県の単純平均は全国値より低い）。
  所定内実労働時間数は6月の時間数なので、6月の平日の日数（2019年20日、2020〜2023年22日、2024年20日、2025年21日）に
  ほぼ連動して年ごとに上下する（2020〜2023年は全国165〜166時間、2024年は160時間）。時間あたりの所定内給与額
  （scheduled_wage × 1000 ÷ hours、円/時）を作ると、その年の暦の影響を受ける。2025年は設計書の範囲（2019〜2024年）に追加した年。
  sex の「男女計」は男・女の行から計算したものではなく公表値（男女の労働者数で重み付けした平均）
columns:
  - name: pref_code
    description: 都道府県コード（JIS X 0401。北海道=1〜沖縄県=47）
    unit: なし（整数）
  - name: year
    description: 調査年（各年6月分の賃金・労働時間）
    unit: 年
  - name: sex
    description: 性別（"男女計"、"男"、"女"）
    unit: なし
  - name: scheduled_wage
    description: 所定内給与額（6月分。きまって支給する現金給与額のうち、超過労働給与額を差し引いた額。所得税等を控除する前の額）
    unit: 千円/月
  - name: hours
    description: 所定内実労働時間数（6月の、事業所の就業規則などで定められた所定労働時間のうち実際に働いた時間数。公表は1時間単位）
    unit: 時間/月
