title: 都道府県別の就業率（国勢調査 2000〜2020年、横長）
file: pref_labor_wide.csv
source: 総務省統計局「国勢調査」時系列データ 人口の労働力状態，就業者の産業・職業 第2表「労働力状態（3区分），男女別人口及び労働力率（15歳以上） － 都道府県（昭和25年～令和2年）」（e-Stat、ファイル ro02.xlsx、2026-10-23取得）から data-raw/fetch_pref_labor_wide.R で計算。元ファイルと出所は data-raw/raw/pref_labor_wide/
rows: 47
unit_of_observation: 都道府県（北海道〜沖縄県、JIS順）。年は列
notes: >-
  就業率 = 就業者 ÷（15歳以上人口 − 労働力状態「不詳」）× 100（男女計、小数1桁に四捨五入）。
  不詳 = 15歳以上人口 − 労働力人口 − 非労働力人口。5回とも原数値（不詳補完をしていない値）を使い、
  不詳を分母から除く（表の「労働力率」と同じ扱い）。2015・2020年の不詳補完値は2000〜2010年に無いので使わない。
  不詳の割合（全国）は 2000年1.6%、2005年3.1%、2010年5.6%、2015年6.6%、2020年10.8%と増えており、
  東京都（2020年23.0%）など大都市で大きい。同じ定義の全国値は 59.1、57.8、57.3、57.5、59.7%。
  2000→2020年に最も上がったのは沖縄県（54.1→60.1、+6.0pt）。
  列名は数字（2000 など）なので、R では `2000` のようにバッククォートで囲んで使う
columns:
  - name: pref
    description: 都道府県名
    unit: なし
  - name: "2000"
    description: 2000年（平成12年）10月1日現在の就業率
    unit: "%"
  - name: "2005"
    description: 2005年（平成17年）10月1日現在の就業率
    unit: "%"
  - name: "2010"
    description: 2010年（平成22年）10月1日現在の就業率
    unit: "%"
  - name: "2015"
    description: 2015年（平成27年）10月1日現在の就業率
    unit: "%"
  - name: "2020"
    description: 2020年（令和2年）10月1日現在の就業率
    unit: "%"
