title: 都道府県別 地域別最低賃金（2002〜2025年度）
file: min_wage_pref.csv
source: 厚生労働省「平成14年度から令和８年度までの地域別最低賃金改定状況」（Excel、https://www.mhlw.go.jp/content/11200000/001756130.xlsx、2026-10-23取得）。data-raw/fetch_min_wage_pref.R で保存済みの元資料から作成（手入力なし）
rows: 1128
unit_of_observation: 都道府県×年度（47県×2002〜2025年度）
notes: >-
  min_wage はその年度に改定（発効）された時間額で、effective_date はその額の発効日。
  改定が無かった年度（2003年度の多くの県、2020年度の東京・大阪など）は元資料どおり前年度と同じ額・同じ発効日が入る。
  発効日は年度によって10月1日前後とは限らない。特に2025年度は県によって2025年10月〜2026年3月とばらつき
  （秋田は2026-03-31）、年度の額が「その年の暦年平均」の水準とは一致しないので、年単位で他の統計と結合するときは注意する。
  全国加重平均額（公表値。2023年度1004円、2024年度1055円、2025年度1121円）は適用労働者数で重み付けした値で、
  47県の単純平均（2025年度 約1067円）より高い。全国加重平均は本ファイルに含めない
columns:
  - name: pref_code
    description: 都道府県コード（JIS X 0401。北海道=1〜沖縄県=47）
    unit: なし（整数）
  - name: fiscal_year
    description: 改定の年度（審議・決定が行われた年度。発効日が翌年1〜3月になる場合も同じ年度）
    unit: 年度
  - name: min_wage
    description: 地域別最低賃金の時間額
    unit: 円/時
  - name: effective_date
    description: 発効年月日（YYYY-MM-DD）。改定が無かった年度は直前の改定の発効日
    unit: 日付
