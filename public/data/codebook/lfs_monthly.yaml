title: 労働力調査 完全失業率と就業者数（全国・月次、2000年1月〜2026年8月）
file: lfs_monthly.csv
source: 総務省統計局「労働力調査 基本集計」。主資料は長期時系列データ 表1-a-1「主要項目（季節調整値及び原数値）」（e-Stat ファイル statInfId 000031831358、2026年8月分公表版・2026-10-02 更新、2026-10-23 取得）。照合に e-Stat API の統計表 0003005865「労働力人口比率，就業率及び完全失業率（2000年1月～）」と 0003005798「就業状態別15歳以上人口（2000年1月～）」（2026-10-23 取得）を使用。data-raw/download_lfs_monthly.R で取得、data-raw/fetch_lfs_monthly.R で作成（手入力なし）
rows: 320
unit_of_observation: 月（全国）
notes: >-
  完全失業率 = 完全失業者 ÷ 労働力人口 × 100（15歳以上、男女計）。
  季節調整値は毎年1月分の公表時に過去にさかのぼって改定される。本データは2026年8月分公表時点の値（2026年1月の改定後）で、
  当時の報道発表の値と0.1ポイント程度違う月がある。
  2011年3〜8月は東日本大震災の影響で全国の調査結果が無く、統計局の補完推計値（2015年国勢調査基準）が入っている。
  就業者数は原数値（季節調整していない値）で、季節による上下動がある。2005年10月〜2021年12月は統計局が
  ベンチマーク人口の切替えに合わせて補正した時系列接続用数値で、当時の公表値や e-Stat データベースの値とは異なる
  （率は補正の対象外で、データベースの値と一致する）。
columns:
  - name: date
    description: 年月（その月の1日の日付、YYYY-MM-01）
    unit: 日付
  - name: unemp_rate_sa
    description: 完全失業率（季節調整値、男女計）
    unit: ％
  - name: unemp_rate_nsa
    description: 完全失業率（原数値、男女計）
    unit: ％
  - name: employed_10k
    description: 就業者数（原数値、男女計、15歳以上）
    unit: 万人
