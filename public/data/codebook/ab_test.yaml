title: 購入画面のA/Bテスト
file: ab_test.csv
source: 合成データ（data-raw/synth_ab_test.R、乱数シード108）
rows: 20000
unit_of_observation: 訪問者
notes: A・B各10,000人。購入率は A 4.0%・B 5.2%。スマホ（6割）A 3.5%→B 5.1%、PC（4割）A 4.75%→B 5.35% で、効果はスマホで大きい
columns:
  - name: visitor_id
    description: 訪問者ID
    unit: なし
  - name: group
    description: 割り当てられた画面（A=現行、B=新しい画面）
    unit: なし
  - name: device
    description: 端末（スマホ・PC）
    unit: なし
  - name: converted
    description: 購入したか（1=購入、0=購入なし）
    unit: なし（0/1）
  - name: revenue
    description: 売上（購入しなかった人は0）
    unit: 円
