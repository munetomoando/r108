<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150" role="img" aria-label="合流点：技能と人脈がどちらも採用に影響する。技能と人脈の間に矢印はない">
<style>
.bg{fill:#ffffff;stroke:#d9d6e8;stroke-width:1}
.node{fill:#ffffff;stroke:#1d2140;stroke-width:2}
.x{fill:#e7ecff}.y{fill:#ffe6e0}.q{fill:#fff2c7}
.t{fill:#1d2140;font-family:'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI',Meiryo,sans-serif;font-size:14px;text-anchor:middle;dominant-baseline:central}
.s{fill:#4a4f6a;font-size:12px}
.e{stroke:#1d2140;stroke-width:2;fill:none}
.h{fill:#1d2140}
@media (prefers-color-scheme: dark){
.bg{fill:#1f2452;stroke:#3d4378}
.node{fill:#1f2452;stroke:#fff8ea}
.x{fill:#2a3170}.y{fill:#4a2633}.q{fill:#3f3826}
.t{fill:#fff8ea}.s{fill:#c3c6e0}
.e{stroke:#fff8ea}.h{fill:#fff8ea}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="299" height="149" rx="16"/>
<line class="e" x1="90.5" y1="55.0" x2="129.5" y2="95.0" marker-end="url(#a)"/>
<line class="e" x1="209.5" y1="55.0" x2="170.5" y2="95.0" marker-end="url(#a)"/>
<rect class="node x" x="15.0" y="17.0" width="110" height="34" rx="10"/>
<text class="t" x="70" y="34">技能 X</text>
<rect class="node y" x="175.0" y="17.0" width="110" height="34" rx="10"/>
<text class="t" x="230" y="34">人脈 Y</text>
<rect class="node q" x="95.0" y="99.0" width="110" height="34" rx="10"/>
<text class="t" x="150" y="116">採用 C</text>
</svg>
