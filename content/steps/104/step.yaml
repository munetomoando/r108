  instructions: |
    **実行する前に**
    - 本文の手順を終え、ステップ102のプロジェクト（`sora_app`）が Git のリポジトリになっていて、コミットが3つ以上あること
    - `.gitignore` に `data/` と `.Renviron` を書き、コミットしてあること

    ダウンロードした `check_104.R` をプロジェクトのフォルダ（`app.R` のあるフォルダ）に置き、コンソールで次を実行します。

    ```r
    source("check_104.R", encoding = "UTF-8")
    ```

    確認スクリプトは git コマンドで履歴と設定を読むだけで、リポジトリは書き換えません。`check_104.R` 自体はコミットしなくて構いません（「コミットしていない変更」には数えません）。
