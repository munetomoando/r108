  instructions: |
    プロジェクトのフォルダに `report.qmd` と `data/ec_orders.csv`・`data/ec_products.csv` があり、Render で HTML（report.html）が出力できる状態にしてから、`check_100.R` を同じフォルダに保存し、コンソールで次を実行します。

    ```r
    source("check_100.R", encoding = "UTF-8")
    ```

    確認スクリプトは report.qmd の YAML ヘッダと見出しを調べ、HTML にレンダリングして、コードが表示されていないこと、冒頭が要約の節であることを確かめます。
