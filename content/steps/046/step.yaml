id: "046"
part: 6
title: 問いを立てる
question: その問いはデータで答えられるか
minutes: 30
mode: browser
learn: []
exercises:
  - id: a
    type: interpret
    free: true
    prompt: |
      次の5つの問いは、記述・因果・予測のどれに当たりますか。①〜⑤の順に、「記述」「因果」「予測」のどれか1語ずつを読点（、）で区切って書いてください（例：記述、記述、因果、予測、予測）。

      ① 2025年度の都道府県別の最低賃金で、最も高い都県と最も低い県の差は何円か
      ② 最低賃金を引き上げると、10代の就業率は下がるか
      ③ そらまめマーケットの各店舗で、来月の売上はいくらになりそうか
      ④ 給付型の奨学金を受けると、卒業後の所得は上がるか
      ⑤ 男女間の賃金格差は、この20年でどれだけ縮まったか
    solution: 記述、因果、予測、因果、記述
    check: |
      ans <- regmatches(.output, gregexpr("記述|因果|予測", .output))[[1]]
      check_that(length(ans) == 5,
                 paste0("「記述」「因果」「予測」の言葉が", length(ans), "個見つかりました。①〜⑤の順に、ちょうど5つ書きましょう。"))
      key <- c("記述", "因果", "予測", "因果", "記述")
      wrong <- which(ans != key)
      check_that(length(wrong) == 0,
                 paste0(paste(c("①", "②", "③", "④", "⑤")[wrong], collapse = "・"),
                        " の類型を見直しましょう。「もし〜を変えたら」を問うのが因果、まだ見ていない値を当てるのが予測、いま・過去の姿を正確に示すのが記述です。"))
    hints:
      - 問いの文末に注目します。「〜すると、…は変わるか」は原因と結果を、「〜になりそうか」はまだ分からない値を、「いくらか」「どれだけ」は起きたことの大きさを問うています。
      - ②と④は、ある政策や制度を「変えたら」結果がどう変わるかを問う形です。③は来月という、まだ観察していない値を当てる形です。
      - 答えの形は「記述、因果、予測、因果、記述」のように5語を並べます。①と⑤は、すでに起きたことの差や変化の大きさを示す問いです。
    tests:
      fail:
        - 記述、因果、予測、記述、記述
        - 記述、予測、予測、因果、記述
        - 記述、因果、予測、因果
  - id: b
    type: interpret
    prompt: |
      手元に、47都道府県の2025年の「大学進学率」と「平均賃金」を並べたデータ（1行が1都道府県）があります。このデータだけでは答えられない問いはどれですか。
    choices:
      - "大学進学率が最も高い都道府県はどこか"
      - "大学進学率と平均賃金の相関係数はいくつか"
      - "大学に進学した人は、進学しなかった人より賃金が高いか"
      - "平均賃金が上位10都道府県の、大学進学率の平均はいくつか"
    answer: 2
    explain: 3つ目は「人」についての問いですが、データの1行は都道府県で、一人ひとりの学歴と賃金は分かりません。進学率の高い県で平均賃金が高くても、高い賃金を得ているのが進学した人かどうかは、県の集計からは分かりません（県単位の関係を個人の関係と読み違えることを「生態学的誤謬」といいます）。答えるには、個人ごとに学歴と賃金を記録したデータ（第37ステップの wage のような個票）が要ります。残りの3つは、県を単位とした記述の問いなので、このデータで答えられます。
  - id: c
    type: write
    free: true
    prompt: |
      あなたの卒論で取り組んでみたい問いを1つ選び、次の4行の形式で書いてください（各行は「見出し：内容」の形。合計80字以上）。
      - 問い：疑問文で1文（「〜か」で終える）
      - 類型：記述・因果・予測のどれか
      - データ：使うデータの名前（または調査名）と、1行が何を表すか（個人・企業・都道府県×年など）
      - 手法：答えを出すための方法（集計・図・回帰・差の差分析など）

      まだ決まっていなければ、第2〜5部で使ったデータで答えられる問いでかまいません。
    solution: |
      問い：最低賃金の引き上げ額が大きい都道府県ほど、パートタイム労働者の時給は大きく上がったか。
      類型：因果
      データ：賃金構造基本統計調査と地域別最低賃金の都道府県別の値（1行が都道府県×年）。
      手法：都道府県と年の固定効果を入れた回帰（差の差分析）で、引き上げ額と時給の伸びの関係を推定する。
    check: |
      expect_min_chars(80)
      expect_text("問い\\s*[:：]", "「問い：」で始まる行を書きましょう。")
      expect_text("問い\\s*[:：][^\\n]*か[。？?]?\\s*(\\n|$)", "問いは「〜か。」のように、疑問文で書きましょう。")
      expect_text("類型\\s*[:：]\\s*(記述|因果|予測)", "「類型：」の後に、記述・因果・予測のどれかを書きましょう。")
      expect_text("データ\\s*[:：]", "「データ：」で始まる行に、使うデータを書きましょう。")
      expect_text("1行|一行|個人|企業|都道府県|世帯|店舗|国|市区町村|学生", "データの行に、1行が何を表すか（個人・企業・都道府県×年など）を書きましょう。")
      expect_text("手法\\s*[:：]", "「手法：」で始まる行に、答えを出す方法を書きましょう。")
    hints:
      - まず問いを疑問文にします。「〜について調べる」ではなく「〜は…か」と書くと、答え（はい・いいえ、または数値）の形がはっきりします。
      - 類型を決めたら、その類型に合う手法を選びます。記述なら集計と図、因果なら他の条件をそろえた比較（回帰、第7部の手法）、予測なら当てる精度を確かめる方法です。データの行には「1行が何か」を必ず書きます。
      - 例「問い：〜は…か。／類型：因果／データ：〇〇調査（1行が個人）／手法：〜を説明変数にした回帰」の4行を、自分の題材に置き換えて書きます。
    tests:
      fail:
        - 最低賃金について調べたいです。データは都道府県のものを使って、回帰分析をする予定です。
        - |
          問い：最低賃金について調べる。
          類型：因果
          データ：賃金構造基本統計調査（1行が都道府県×年）
          手法：都道府県と年の固定効果を入れた回帰で、引き上げ額と時給の伸びの関係を推定する。
        - |
          問い：最低賃金の引き上げ額が大きい都道府県ほど、パートの時給は大きく上がったか。
          類型：たぶん回帰
          データ：賃金構造基本統計調査（1行が都道府県×年）
          手法：都道府県と年の固定効果を入れた回帰で推定する。
