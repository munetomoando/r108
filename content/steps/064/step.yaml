id: "064"
part: 8
title: パネルデータ
question: 同じ県を毎年見る利点は何か
minutes: 45
mode: browser
packages: [readr, dplyr, ggplot2]
data: [minwage_panel.csv, training_obs.csv]
learn: [n_distinct, ungroup]
review_of: "063"
setup: |
  library(readr); library(dplyr); library(ggplot2)
  # 47県×2012〜2024年の架空のパネル。12県で2019年から最低賃金の「特別引上げ」（架空の政策）
  mw <- read_csv("data/minwage_panel.csv", show_col_types = FALSE)
  # 第63ステップの職業訓練の観察データ（d の復習で使う）
  obs <- read_csv("data/training_obs.csv", show_col_types = FALSE)
exercises:
  - id: a
    type: write
    prompt: |
      mw が「県×年で1行」の形になっているかを確かめます。
      1. count(pref_code, year) で県と年の組ごとの行数を数え、n が1より大きい組だけを filter() で残して dup に代入する（重複がなければ0行になります）
      2. mw を summarise() して、県の数 = n_distinct(pref_code)、年の数 = n_distinct(year)、行数 = n() の表を shape に代入し、shape を表示する
    starter: |
      dup <- mw |>

      shape <- mw |>
        summarise()
      shape
    solution: |
      dup <- mw |>
        count(pref_code, year) |>
        filter(n > 1)
      shape <- mw |>
        summarise(県の数 = n_distinct(pref_code), 年の数 = n_distinct(year), 行数 = n())
      shape
    check: |
      expect_object("dup", class = "data.frame")
      expect_cols(dup, c("pref_code", "year", "n"))
      expect_df_equal(dup, .sol$dup)
      expect_uses("n_distinct")
      expect_object("shape", class = "data.frame")
      expect_cols(shape, c("県の数", "年の数", "行数"))
      expect_df_equal(shape, .sol$shape)
    hints:
      - count() に2つの列を渡すと、その組み合わせごとに行数 n を数えます。県×年で1行なら、n はすべて1です。
      - n_distinct(列) はその列に何種類の値があるかを数えます。n() は行数です。
      - |
        dup <- mw |>
          count(pref_code, year) |>
          filter(n > 1)
        shape <- mw |>
          summarise(県の数 = n_distinct(pref_code), 年の数 = n_distinct(year), 行数 = n())
        shape
    tests:
      fail:
        - |
          dup <- mw |>
            count(pref_code) |>
            filter(n > 1)
          shape <- mw |>
            summarise(県の数 = n_distinct(pref_code), 年の数 = n_distinct(year), 行数 = n())
          shape
        - |
          dup <- mw |>
            count(pref_code, year) |>
            filter(n > 1)
          shape <- mw |>
            summarise(県の数 = n(), 年の数 = n_distinct(year), 行数 = n())
          shape
  - id: b
    type: write
    prompt: |
      県ごとの平均を引いて、「その県のいつもの水準からどれだけ上下したか」を作ります。
      1. mw を pref_code でグループに分け、mutate() で youth_mean = mean(youth_emp_rate)（その県の13年間の平均）と youth_dm = youth_emp_rate - youth_mean を加え、ungroup() でグループを外して mw_dm に代入する
      2. mw_dm を summarise() して、元の若年就業率の標準偏差 sd_raw = sd(youth_emp_rate) と、県内平均を引いた後の標準偏差 sd_dm = sd(youth_dm) を表示する
    starter: |
      mw_dm <- mw |>
        group_by(pref_code) |>
        mutate() |>
        ungroup()
      mw_dm |>
        summarise()
    solution: |
      mw_dm <- mw |>
        group_by(pref_code) |>
        mutate(youth_mean = mean(youth_emp_rate),
               youth_dm = youth_emp_rate - youth_mean) |>
        ungroup()
      mw_dm |>
        summarise(sd_raw = sd(youth_emp_rate), sd_dm = sd(youth_dm))
    check: |
      expect_object("mw_dm", class = "data.frame")
      expect_cols(mw_dm, c("youth_mean", "youth_dm"))
      check_that(length(dplyr::group_vars(mw_dm)) == 0,
                 "mw_dm にグループが残っています。最後に ungroup() をつなぎましょう。")
      expect_df_equal(mw_dm, .sol$mw_dm)
      expect_df_equal(.value, .sol_value)
    hints:
      - group_by(pref_code) のあとに mutate() で mean() を使うと、全体の平均ではなく、その県の平均が各行に入ります。
      - mutate(youth_mean = mean(youth_emp_rate), youth_dm = youth_emp_rate - youth_mean) です。標準偏差は sd() で求めます。
      - |
        mw_dm <- mw |>
          group_by(pref_code) |>
          mutate(youth_mean = mean(youth_emp_rate),
                 youth_dm = youth_emp_rate - youth_mean) |>
          ungroup()
        mw_dm |>
          summarise(sd_raw = sd(youth_emp_rate), sd_dm = sd(youth_dm))
    tests:
      fail:
        - |
          mw_dm <- mw |>
            mutate(youth_mean = mean(youth_emp_rate),
                   youth_dm = youth_emp_rate - youth_mean)
          mw_dm |>
            summarise(sd_raw = sd(youth_emp_rate), sd_dm = sd(youth_dm))
        - |
          mw_dm <- mw |>
            group_by(year) |>
            mutate(youth_mean = mean(youth_emp_rate),
                   youth_dm = youth_emp_rate - youth_mean) |>
            ungroup()
          mw_dm |>
            summarise(sd_raw = sd(youth_emp_rate), sd_dm = sd(youth_dm))
        - |
          mw_dm <- mw |>
            group_by(pref_code) |>
            mutate(youth_mean = mean(youth_emp_rate),
                   youth_dm = youth_emp_rate - youth_mean)
          mw_dm |>
            summarise(sd_raw = sd(youth_emp_rate), sd_dm = sd(youth_dm))
  - id: c
    type: write
    prompt: |
      特別引上げの対象県（treated = 1）と対象外の県（treated = 0）で、若年就業率の平均の推移を比べる図を描きます。
      1. mw を treated と year でグループに分け、summarise(youth = mean(youth_emp_rate), .groups = "drop") で集計して trend に代入する（.groups = "drop" は集計後にグループを外す指定です）
      2. trend で、横軸 year、縦軸 youth、色を factor(treated) とした折れ線グラフを geom_line() で描き、引上げの直前に geom_vline(xintercept = 2018.5, linetype = "dashed") で破線を引く
    starter: |
      trend <- mw |>

      ggplot(trend, aes()) +
        geom_line() +
        geom_vline(xintercept = 2018.5, linetype = "dashed")
    solution: |
      trend <- mw |>
        group_by(treated, year) |>
        summarise(youth = mean(youth_emp_rate), .groups = "drop")
      ggplot(trend, aes(x = year, y = youth, colour = factor(treated))) +
        geom_line() +
        geom_vline(xintercept = 2018.5, linetype = "dashed")
    check: |
      expect_object("trend", class = "data.frame")
      expect_cols(trend, c("treated", "year", "youth"))
      expect_nrow(trend, 26)
      expect_df_equal(trend, .sol$trend, ignore_row_order = TRUE)
      expect_ggplot(geom = "line", x = "year", y = "youth", colour = "factor(treated)")
      check_that(any(vapply(.plot$layers, function(l) inherits(l$geom, "GeomVline"), logical(1))),
                 "geom_vline(xintercept = 2018.5, linetype = \"dashed\") で引上げ直前の破線を加えましょう。")
      expect_df_equal(.plot$data, .sol_plot$data, ignore_row_order = TRUE)
    hints:
      - 2つのグループ × 13年 = 26行の表を作ってから描きます。group_by() に treated と year の2つを渡します。
      - summarise(youth = mean(youth_emp_rate), .groups = "drop") と書きます。図は aes(x = year, y = youth, colour = factor(treated)) です。
      - |
        trend <- mw |>
          group_by(treated, year) |>
          summarise(youth = mean(youth_emp_rate), .groups = "drop")
        ggplot(trend, aes(x = year, y = youth, colour = factor(treated))) +
          geom_line() +
          geom_vline(xintercept = 2018.5, linetype = "dashed")
    tests:
      fail:
        - |
          trend <- mw |>
            group_by(year) |>
            summarise(youth = mean(youth_emp_rate), .groups = "drop")
          ggplot(trend, aes(x = year, y = youth)) +
            geom_line() +
            geom_vline(xintercept = 2018.5, linetype = "dashed")
        - |
          trend <- mw |>
            group_by(treated, year) |>
            summarise(youth = mean(youth_emp_rate), .groups = "drop")
          ggplot(trend, aes(x = year, y = youth, colour = treated)) +
            geom_line() +
            geom_vline(xintercept = 2018.5, linetype = "dashed")
        - |
          trend <- mw |>
            group_by(treated, year) |>
            summarise(youth = mean(youth_emp_rate), .groups = "drop")
          ggplot(trend, aes(x = year, y = youth, colour = factor(treated))) +
            geom_line()
  - id: d
    type: write
    review: true
    prompt: |
      【第63ステップの復習】職業訓練の観察データ obs で、訓練後の年収 earn_post を treat、prior_earn、age、I(age^2)、educ_years、female で説明する回帰を推定し、treat の係数を est_reg に代入して表示してください。
    starter: |
      est_reg <-
      est_reg
    solution: |
      est_reg <- coef(lm(earn_post ~ treat + prior_earn + age + I(age^2) + educ_years + female,
                         data = obs))[["treat"]]
      est_reg
    check: |
      expect_object("est_reg", class = "numeric")
      check_that(length(est_reg) == 1, "est_reg は1つの数にしましょう。coef(モデル)[[\"treat\"]] で取り出せます。")
      expect_value(est_reg, .sol$est_reg, label = "est_reg")
      expect_value(.value, .sol_value, label = "表示した est_reg")
    hints:
      - 第63ステップ b と同じく、処置の前に決まっている変数を説明変数に加えます。年齢は2乗の項も入れます。
      - 式は earn_post ~ treat + prior_earn + age + I(age^2) + educ_years + female です。coef(モデル)[["treat"]] で treat の係数を取り出します。
      - |
        est_reg <- coef(lm(earn_post ~ treat + prior_earn + age + I(age^2) + educ_years + female,
                           data = obs))[["treat"]]
        est_reg
    tests:
      fail:
        - |
          est_reg <- coef(lm(earn_post ~ treat, data = obs))[["treat"]]
          est_reg
        - |
          est_reg <- coef(lm(earn_post ~ treat + prior_earn + age + educ_years + female,
                             data = obs))[["treat"]]
          est_reg
