id: "107"
part: 12
title: 分析を設計して伝える
question: 経営者は何を知りたいか
minutes: 40
mode: browser
packages: [dplyr]
learn: [writeLines, paste0]
setup: |
  library(dplyr)
  # 第90ステップ（広告キャンペーンの差の差分析）で求めた結果。そらまめマーケットは架空の会社
  # estimate は treat:post の係数（注文件数の対数）、conf_low・conf_high は95%信頼区間
  did <- tibble(estimate = 0.0715, std_error = 0.0301, p_value = 0.0216,
                conf_low = 0.0110, conf_high = 0.1321)
  # 費用対効果（2025年6〜12月）。extra_orders は増えた注文件数、extra_profit は増えた粗利（円）、net は広告費を引いた差（円）
  roi <- tibble(case = c("下限", "推定値", "上限"),
                beta = c(0.0110, 0.0715, 0.1321),
                extra_orders = c(57, 360, 645),
                extra_profit = c(63995, 404293, 724596),
                net = c(-286005, 54293, 374596))
  ad_cost <- 350000        # 広告費（円）。月5万円×7か月（架空の前提）
  profit_per_order <- 1124 # 1注文あたりの粗利（円）
exercises:
  - id: a
    type: interpret
    prompt: |
      第90ステップの広告キャンペーンの分析を、2人の担当者が経営会議向けに報告しました。中身の数字は同じです。

      **報告A**：本分析では、注文明細61,275行と顧客マスタ5,000人分を結合し、県×月の1,128行のパネルデータを作成した。注文件数の対数を被説明変数とし、県と月の固定効果を入れた差の差分析を行った。treat:post の係数は0.0715（県でクラスタした標準誤差0.0301、p = 0.022）で、5%水準で統計的に有意であった。以上より、広告キャンペーンには効果があったと結論する。

      **報告B**：広告キャンペーンで、実施した10県の注文は約7%増えました。ただし、増えた粗利は約40万円で、広告費35万円をわずかに上回る程度です。推定の幅を考えると、悪い場合は約29万円の赤字になります。続けるなら、来年度は実施県を無作為に選んで効果を測り直すことを提案します（根拠：差の差分析、95%信頼区間 約1〜14%増）。

      経営会議への報告として、どちらがよいと言えますか。
    choices:
      - "報告A。分析の手順とデータの大きさを先に示しているので、結論の信頼性が伝わる"
      - "報告A。p値が0.05より小さいことを示しており、キャンペーンが黒字だったことが確かに言える"
      - "報告B。結論を最初に、経営者の判断に使える単位（注文の増加率と金額）で述べ、不確かさと次の一手まで書いている。手順は根拠として後ろに短く添えている"
      - "どちらも同じ数字を報告しているので、よしあしはない"
    answer: 2
    explain: 経営会議の出席者が知りたいのは「効いたか」「もうかったか」「どうするか」です。報告Bは、結論を先に置き（結論先行）、効果を注文の増加率と金額に直し、信頼区間の下限では赤字になるという不確かさと、次にすべきことまで書いています。報告Aは、手順の説明が先に長く続き、肝心の結論は最後の1文で、しかも「効果があった」としか言っていません。統計的に有意であることは、広告費に見合ったこととは別の問いです（第87ステップ）。p値が小さくても、黒字だったとは言えません（選択肢2は誤り）。手順やデータの大きさは、聞かれたら答えられるように付録に回します（選択肢1は誤り）。同じ数字でも、並べる順序と単位で、伝わる内容と判断のしやすさが大きく変わります（選択肢4は誤り）。
  - id: b
    type: interpret
    prompt: |
      経営会議で、「キャンペーンの前は実施県と非実施県の注文が同じように動いていて、開始した2025年6月以降に実施県だけが上に離れた」ことを1枚の図で見せたいと思います。実施県（10県）と非実施県（37県）では、月の注文件数の水準が3倍ほど違います。目的に最も合う図はどれですか。
    choices:
      - "2025年の県別の注文件数を、47県の円グラフで示す"
      - "実施県と非実施県の月別の注文件数を、そのままの件数で2本の折れ線にする"
      - "実施県と非実施県それぞれの「キャンペーン前の月平均」を100とした指数を2本の折れ線にし、2025年6月に縦線を引く"
      - "費用対効果の表 roi の net（下限・推定値・上限）を3本の棒グラフにする"
    answer: 2
    explain: 2つの群の時間の変化を比べるなら、横軸を月にした折れ線が基本です。水準が3倍違う群をそのままの件数で描くと、非実施県の線が上の方で大きく動き、実施県の線は下で平らに見えて、「同じように動いていたか」が読み取れません（選択肢2は不適）。それぞれの群のキャンペーン前の平均を100とした指数にそろえると、前の期間は2本が重なり、6月以降に実施県の線が上に離れる様子が見えます。開始時点の縦線は、読み手の目を比べるべき場所に向けます。円グラフは時間の変化を示せず、47に分けると比較もできません（選択肢1は不適）。net の棒グラフは「もうかったか」を示す図で、目的が違います（選択肢4は不適）。図は「何を見せたいか」を1文で決めてから選びます。
  - id: c
    type: write
    prompt: |
      経営会議の資料に載せる「1枚の要約」を Markdown で書きます。Markdown の1行を文字列1つにして、c() で並べた文字のベクトルを memo に代入し、writeLines(memo) で表示してください。次の形を守ります。
      1. 最初の行は、内容が分かる見出し（「# 」で始める）
      2. 続けて「## 結論」「## 根拠」「## 次の一手」の3つの節をこの順に置き、それぞれの下に1行以上の本文を書く（空の行は "" で入れる）
      3. 結論は3行以内に。注文の増加率（%）か金額（万円）の数字を入れる
      4. 根拠には、推定の不確かさ（信頼区間や、その下限・上限での費用対効果）を入れる
      5. 全体で800字以内（1枚に収まる長さ）
      数字は setup の did・roi・ad_cost を見て書きます。paste0() と round() で roi から数字を作ってもかまいません。
    starter: |
      memo <- c(
        "# ",
        "",
        "## 結論",
        "",
        "## 根拠",
        "",
        "## 次の一手",
        ""
      )
      writeLines(memo)
    solution: |
      memo <- c(
        "# 広告キャンペーン（2025年6〜12月、10県）の効果と費用",
        "",
        "## 結論",
        "注文は約7%増えたが、増えた粗利は広告費35万円をわずかに上回る程度で、赤字の可能性も残る。",
        "続けるなら、実施県を無作為に選んで効果を測り直す。",
        "",
        "## 根拠",
        "- 差の差分析で、実施県の注文件数は非実施県と比べて約7%増（95%信頼区間 約1〜14%）。",
        paste0("- 7か月で約", roi$extra_orders[2], "件の上積み。増えた粗利は約",
               round(roi$extra_profit[2] / 10000), "万円（広告費 ", ad_cost / 10000, "万円）。"),
        "- 信頼区間の下限では約29万円の赤字、上限では約37万円の黒字。",
        "- キャンペーン前の推移は実施県と非実施県でそろっていた（平行トレンドの前提と矛盾しない）。",
        "",
        "## 次の一手",
        "- 来年度は実施県を無作為に選び、A/Bテストと同じ形で効果を測る。",
        "- 1注文あたりの粗利を県別に見直し、費用対効果の見積もりを精密にする。"
      )
      writeLines(memo)
    check: |
      expect_object("memo", class = "character")
      expect_uses("writeLines", "最後に writeLines(memo) で、Markdown を1行ずつ表示しましょう。")
      ln <- trimws(memo)
      body_lines <- which(nzchar(ln))
      check_that(length(body_lines) >= 7,
                 "memo の行が足りません。見出し、3つの節の見出し、それぞれの本文を1行ずつ、文字列にして c() で並べましょう。")
      check_that(grepl("^# \\S", ln[body_lines[1]]),
                 "最初の行は「# 」で始まる見出しにしましょう（# の後に空白を1つ入れ、内容が分かる見出しを書きます）。")
      head_at <- function(word) {
        i <- grep(paste0("^##\\s*", word), ln)
        if (length(i) == 0) NA_integer_ else i[1]
      }
      p_concl <- head_at("結論")
      p_basis <- head_at("根拠")
      p_next <- head_at("次の一手")
      check_that(!is.na(p_concl), "「## 結論」の見出しがありません。")
      check_that(!is.na(p_basis), "「## 根拠」の見出しがありません。")
      check_that(!is.na(p_next), "「## 次の一手」の見出しがありません。")
      check_that(p_concl < p_basis && p_basis < p_next,
                 "節の順序は「結論」→「根拠」→「次の一手」です。経営者が最初に読むところに結論を置きます。")
      check_that(sum(grepl("^## ", ln)) == 3,
                 "「## 」で始まる節の見出しは、結論・根拠・次の一手の3つにしましょう。")
      section <- function(p) {
        heads <- grep("^#", ln)
        end <- min(c(heads[heads > p], length(ln) + 1))
        s <- if (end - 1 >= p + 1) ln[(p + 1):(end - 1)] else character(0)
        s[nzchar(s)]
      }
      s_concl <- section(p_concl)
      s_basis <- section(p_basis)
      s_next <- section(p_next)
      check_that(length(s_concl) >= 1, "「## 結論」の下に本文を書きましょう。")
      check_that(length(s_basis) >= 1, "「## 根拠」の下に本文を書きましょう。")
      check_that(length(s_next) >= 1, "「## 次の一手」の下に本文を書きましょう。")
      check_that(length(s_concl) <= 3, "結論は3行以内に短くまとめましょう。詳しいことは根拠に回します。")
      check_that(any(grepl("[0-9０-９]", s_concl)) && any(grepl("%|％|万円|円", s_concl)),
                 "結論に、注文の増加率（%）か金額（万円）の数字を入れましょう。")
      check_that(any(grepl("信頼区間|下限|上限|幅|赤字", s_basis)),
                 "根拠に、推定の不確かさ（95%信頼区間や、下限・上限での費用対効果）を入れましょう。")
      check_that(sum(nchar(ln)) <= 800,
                 "全体が800字を超えています。1枚に収まるよう、根拠を絞りましょう。")
    hints:
      - Markdown では「# 」が大見出し、「## 」が節の見出し、「- 」が箇条書きです。memo は c("# 見出し", "", "## 結論", "本文", ...) のように、1行を1つの文字列にして並べます。
      - 結論には「注文は約7%増えた」「増えた粗利は約40万円で広告費35万円をわずかに上回る」「下限では赤字」のように数字を入れます。根拠には「95%信頼区間 約1〜14%」「下限では約29万円の赤字、上限では約37万円の黒字」を、次の一手には「実施県を無作為に選んで測り直す」などを書きます。
      - |
        memo <- c(
          "# 広告キャンペーン（2025年6〜12月、10県）の効果と費用",
          "",
          "## 結論",
          "注文は約7%増えたが、増えた粗利は広告費35万円をわずかに上回る程度で、赤字の可能性も残る。",
          "続けるなら、実施県を無作為に選んで効果を測り直す。",
          "",
          "## 根拠",
          "- 差の差分析で、実施県の注文件数は約7%増（95%信頼区間 約1〜14%）。",
          "- 増えた粗利は約40万円。下限では約29万円の赤字、上限では約37万円の黒字。",
          "",
          "## 次の一手",
          "- 来年度は実施県を無作為に選び、効果を測り直す。"
        )
        writeLines(memo)
    tests:
      fail:
        - |
          memo <- c(
            "# 広告キャンペーンの効果",
            "## 根拠",
            "- 差の差分析で、実施県の注文件数は約7%増（95%信頼区間 約1〜14%）。",
            "## 結論",
            "注文は約7%増えたが、赤字の可能性も残る。",
            "## 次の一手",
            "- 実施県を無作為に選び、効果を測り直す。"
          )
          writeLines(memo)
        - |
          memo <- c(
            "# 広告キャンペーンの効果",
            "## 結論",
            "キャンペーンには効果があった。",
            "## 根拠",
            "- 差の差分析で、実施県の注文件数は約7%増（95%信頼区間 約1〜14%）。",
            "## 次の一手",
            "- 実施県を無作為に選び、効果を測り直す。"
          )
          writeLines(memo)
        - |
          memo <- c(
            "# 広告キャンペーンの効果",
            "## 結論",
            "注文は約7%増えたが、赤字の可能性も残る。",
            "## 根拠",
            "- 差の差分析で、実施県の注文件数は約7%増（95%信頼区間 約1〜14%）。",
            "- 増えた粗利は約40万円。"
          )
          writeLines(memo)
        - |
          memo <- c(
            "# 広告キャンペーンの効果",
            "## 結論",
            "注文は約7%増えたが、赤字の可能性も残る。",
            "## 根拠",
            "- 差の差分析で、注文件数は約7%増えた。",
            "## 次の一手",
            "- 実施県を無作為に選び、効果を測り直す。"
          )
          writeLines(memo)
        - |
          memo <- c(
            "# 広告キャンペーンの効果",
            "## 結論",
            "注文は約7%増えたが、赤字の可能性も残る。",
            "## 根拠",
            "- 差の差分析で、実施県の注文件数は約7%増（95%信頼区間 約1〜14%）。",
            "## 次の一手",
            "- 実施県を無作為に選び、効果を測り直す。"
          )
          memo
