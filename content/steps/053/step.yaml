    ```

    確認スクリプトは、プロジェクトを一時フォルダに2回コピーし、`output` フォルダがない状態からスクリプトを番号順に実行して、できた結果ファイル（csv など）を比べます。あなたのフォルダのファイルは書き換えません。1分ほどかかることがあります。
